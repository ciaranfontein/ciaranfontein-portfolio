<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: product-first-c.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7f7}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1506px">
  <div class="r-header-name region text" data-region="header-name"><!-- name in compact header --><p style="font-size:var(--r-header-name-font);line-height:1.05;margin:0">header-name</p></div>
  <div class="r-header-nav region control" data-region="header-nav"><!-- work, about, and contact links: rebuild the control's chrome from the crop (comp-spec.mjs --crop header-nav); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-hero-headline region text" data-region="hero-headline"><!-- two-line mobile products headline --><p style="font-size:var(--r-hero-headline-font);font-family:var(--r-hero-headline-family),sans-serif;font-weight:var(--r-hero-headline-weight);line-height:1.05;margin:0">hero-headline</p></div>
  <div class="r-hero-summary region text" data-region="hero-summary"><!-- three-line role, ownership, and location summary --><p style="font-size:var(--r-hero-summary-font);line-height:1.05;margin:0">hero-summary</p></div>
  <figure class="r-headshot region plate" data-region="headshot"><img src="..\..\..\assets\plates\headshot.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-guusto-intro region text" data-region="guusto-intro"><!-- featured project label, Guusto title, and product description --><p style="font-size:var(--r-guusto-intro-font);line-height:1.05;margin:0">guusto-intro</p></div>
  <div class="r-guusto-evidence region text" data-region="guusto-evidence"><!-- outcome, responsibility, platforms, and tenure evidence --><p style="font-size:var(--r-guusto-evidence-font);line-height:1.05;margin:0">guusto-evidence</p></div>
  <figure class="r-guusto-product region plate" data-region="guusto-product"><img src="..\..\..\assets\plates\guusto-product.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-independent-intro region text" data-region="independent-intro"><!-- independent products heading and summary --><p style="font-size:var(--r-independent-intro-font);line-height:1.05;margin:0">independent-intro</p></div>
  <figure class="r-kirakiran-product region plate" data-region="kirakiran-product"><img src="..\..\..\assets\plates\kirakiran-product.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-kirakiran-copy region text" data-region="kirakiran-copy"><!-- KiraKiran title, purpose, and platforms --><p style="line-height:1.05;margin:0">kirakiran-copy</p></div>
  <figure class="r-meigaza-product region plate" data-region="meigaza-product"><img src="..\..\..\assets\plates\meigaza-product.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-meigaza-copy region text" data-region="meigaza-copy"><!-- Meigaza title, purpose, and platforms --><p style="line-height:1.05;margin:0">meigaza-copy</p></div>
  <figure class="r-fate-product region plate" data-region="fate-product"><img src="..\..\..\assets\plates\fate-product.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-fate-copy region text" data-region="fate-copy"><!-- Fate title, purpose, and platforms --><p style="line-height:1.05;margin:0">fate-copy</p></div>
  <div class="r-qa-heading region text" data-region="qa-heading"><!-- mobile QA with Maestro heading --><p style="font-size:var(--r-qa-heading-font);line-height:1.05;margin:0">qa-heading</p></div>
  <div class="r-qa-copy region text" data-region="qa-copy"><!-- staging-locked Maestro and YAML evidence --><p style="font-size:var(--r-qa-copy-font);line-height:1.05;margin:0">qa-copy</p></div>
  <div class="r-recommendation-heading region text" data-region="recommendation-heading"><!-- recommendation heading and Guusto context --><p style="font-size:var(--r-recommendation-heading-font);line-height:1.05;margin:0">recommendation-heading</p></div>
  <div class="r-recommendation-quote region text" data-region="recommendation-quote"><!-- Felipe recommendation excerpt --><p style="font-size:var(--r-recommendation-quote-font);line-height:1.05;margin:0">recommendation-quote</p></div>
  <div class="r-recommendation-attribution region text" data-region="recommendation-attribution"><!-- Felipe name and title --><p style="font-size:var(--r-recommendation-attribution-font);line-height:1.05;margin:0">recommendation-attribution</p></div>
</main>
</body>
</html>
